name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  WAILS_VERSION: v3.0.0-beta.19

jobs:
  validate:
    name: Validate source and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be a stable semantic version for a public release: $version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($version)." >&2
            exit 1
          fi

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Run Go tests
        run: go test -tags gtk3 ./...

  macos-guest:
    name: Build macOS native guest
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install guest-image tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs zstd

      - name: Build guest assets
        run: ./scripts/build-macos-guest-assets-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-guest-arm64
          path: dist/macos-guest/
          if-no-files-found: error
          retention-days: 2

  macos:
    name: macOS ${{ matrix.arch }} release
    needs: macos-guest
    runs-on: macos-14
    environment: release-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            native: true
          - arch: amd64
            native: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.native
        with:
          name: macos-guest-arm64
          path: macos-guest

      # The SwiftUI app (macos/) needs Swift 5.9 (Xcode 15) or later: use the newest Xcode.
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Install build dependencies
        run: |
          npm ci --prefix frontend
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure optional Apple signing credentials
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          names=(MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)
          configured=0
          for name in "${names[@]}"; do
            [[ -n "${!name:-}" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne "${#names[@]}" ]]; then
            echo "Configure all six Apple signing secrets, or leave all six unset for an unsigned macOS release." >&2
            exit 1
          fi
          if [[ "$configured" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing credentials are not configured. Publishing unsigned macOS artifacts."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          certificate_path="$RUNNER_TEMP/dockiva-signing.p12"
          keychain_path="$RUNNER_TEMP/dockiva-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"

          xcrun notarytool store-credentials dockiva-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      # Dockiva Engine (bin/dockiva-engine) is built from the private dockiva-engine
      # repository at the commit pinned in DOCKIVA_ENGINE_REF. The token secret keeps
      # its original name, VMFREE_RUNTIME_TOKEN.
      - name: Locate Dockiva Engine
        if: matrix.native
        id: engine
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.VMFREE_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ENGINE_TOKEN:-}" ]]; then
            echo "Set the VMFREE_RUNTIME_TOKEN secret (read access to Tomnerb/dockiva-engine) to build Dockiva Engine." >&2
            exit 1
          fi
          ref="$(tr -d '[:space:]' < DOCKIVA_ENGINE_REF)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DOCKIVA_ENGINE_REF must hold a full commit hash: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.native
        with:
          repository: Tomnerb/dockiva-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: dockiva-engine
          token: ${{ secrets.VMFREE_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Build Dockiva Engine
        if: matrix.native
        working-directory: dockiva-engine
        run: python3 scripts/bundle_dockiva_engine.py --output ../bin

      - name: Build and package
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          build_args=("${{ matrix.arch }}")
          if [[ "${{ matrix.native }}" == "true" ]]; then
            build_args+=(--guest-assets ./macos-guest)
          else
            build_args+=(--external-only)
          fi
          if [[ "${{ steps.macos_signing.outputs.enabled }}" == "true" ]]; then
            ./scripts/build-macos.sh "${build_args[@]}" \
              --release \
              --sign-identity "$MACOS_SIGN_IDENTITY" \
              --notary-profile dockiva-ci
          else
            ./scripts/build-macos.sh "${build_args[@]}" \
              --unsigned-release
          fi

      - name: Verify signed outputs
        if: steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "dist/macos-${{ matrix.arch }}/Dockiva.app"
          xcrun stapler validate "dist/macos-${{ matrix.arch }}/Dockiva.app"
          xcrun stapler validate "dist/macos-${{ matrix.arch }}/Dockiva-$(cat VERSION)-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/macos-${{ matrix.arch }}/Dockiva-*-macOS-${{ matrix.arch }}.dmg
            dist/macos-${{ matrix.arch }}/Dockiva-*-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/dockiva-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dockiva-signing.p12"

  windows:
    name: Windows amd64 release
    needs: validate
    runs-on: windows-2025
    environment: release-windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm ci --prefix frontend
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"
          Add-Content $env:GITHUB_PATH "$(go env GOPATH)\bin"
          choco install nsis -y --no-progress

      - name: Configure optional signing certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure both WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or leave both unset for an unsigned Windows release."
          }
          if (-not $hasCertificate) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "Windows signing credentials are not configured. Publishing unsigned Windows artifacts."
            exit 0
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\dockiva-signing.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build application
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          $info.fixed.file_version = $version
          $info.info.'0000'.ProductVersion = $version
          $info | ConvertTo-Json -Depth 8 | Set-Content build/windows/info.json -Encoding utf8
          wails3 task windows:build ARCH=amd64
          if ("${{ steps.windows_signing.outputs.enabled }}" -eq "true") {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found." }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\dockiva-signing.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" bin\dockiva.exe
          }

      - name: Create per-user installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          Push-Location build/windows/nsis
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DWAILS_INSTALL_SCOPE=user" "/DREQUEST_EXECUTION_LEVEL=user" "/DINFO_PROJECTNAME=Dockiva" "/DINFO_COMPANYNAME=Dockiva" "/DINFO_PRODUCTNAME=Dockiva" "/DINFO_PRODUCTVERSION=$version" "/DARG_WAILS_AMD64_BINARY=$pwd\..\..\..\bin\dockiva.exe" project.nsi
          Pop-Location

          if ("${{ steps.windows_signing.outputs.enabled }}" -eq "true") {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found." }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\dockiva-signing.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" bin\Dockiva-amd64-installer.exe
          }

          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path bin/dockiva.exe -DestinationPath "dist/release/Dockiva-$version-windows-amd64.zip" -Force
          Copy-Item bin/Dockiva-amd64-installer.exe "dist/release/Dockiva-$version-windows-amd64-installer.exe"

      - name: Verify Authenticode signatures
        if: steps.windows_signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $binary = Get-AuthenticodeSignature bin/dockiva.exe
          $installer = Get-AuthenticodeSignature bin/Dockiva-amd64-installer.exe
          if ($binary.Status -ne "Valid") { throw "Application signature is $($binary.Status)." }
          if ($installer.Status -ne "Valid") { throw "Installer signature is $($installer.Status)." }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-amd64
          path: dist/release/
          if-no-files-found: error

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\dockiva-signing.pfx" -Force -ErrorAction SilentlyContinue

  linux:
    name: Linux ${{ matrix.arch }} release
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
          npm ci --prefix frontend
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build user-installable archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          ./scripts/build-linux.sh "${{ matrix.arch }}"
          mkdir -p dist/release/stage
          install -m 0755 "dist/linux-${{ matrix.arch }}/dockiva" dist/release/stage/dockiva
          tar -C dist/release/stage -czf "dist/release/Dockiva-$version-linux-${{ matrix.arch }}.tar.gz" dockiva
          rm -rf dist/release/stage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create combined updater checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*-darwin-*.zip' -o -name '*-windows-*.zip' -o -name '*-linux-*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          sha256sum --check SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "Dockiva v$version" \
              --generate-notes
          fi
