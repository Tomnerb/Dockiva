name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Self-hosted Dockiva runner (scripts/ci-runner/README.md); fork PRs and
    # the CI_RUNNER=hosted fallback use GitHub-hosted ubuntu-24.04.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNER == 'hosted') && 'ubuntu-24.04' || 'dockiva' }}
    env:
      # ponytail: Dockiva Engine (<= 0.6.10) refuses root's mkdir inside a
      # read-only directory, so tar cannot restore a module cache saved with
      # Go's default read-only directories, and the build then fails on the
      # missing files. Keep the directories writable; drop this once the
      # engine lets root write there, as Linux does.
      GOFLAGS: -modcacherw
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run Go tests
        run: go test -tags gtk3 ./...
